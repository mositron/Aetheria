# Local production-like stack for Aetheria.
#   docker compose up -d        → start everything
#   docker compose logs -f      → follow logs
#   docker compose down         → stop (keeps volumes)
#   docker compose down -v      → stop + wipe data
#
# For pure dev (vite + tsx watch, SQLite), don't use compose — just `pnpm dev`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aetheria
      POSTGRES_USER: aetheria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetheria_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetheria -d aetheria"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: aetheria-server:local
    ports:
      - "2567:2567"
    environment:
      NODE_ENV: production
      PORT: 2567
      ENFORCE_HTTPS: "false"
      DATABASE_URL: postgresql://aetheria:${POSTGRES_PASSWORD:-aetheria_dev}@postgres:5432/aetheria?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32+chars}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin}
      # SENTRY_DSN: leave unset locally
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
